<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="hiveGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7C14D"/>
      <stop offset="100%" stop-color="#D4930D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Hexagon hive cell (same family as the chat client) -->
  <polygon points="64,8 112,36 112,92 64,120 16,92 16,36"
           fill="url(#hiveGradient)" stroke="#B87A00" stroke-width="3"
           filter="url(#shadow)"/>

  <!-- Inner honeycomb grid lines -->
  <polygon points="64,22 100,43 100,85 64,106 28,85 28,43"
           fill="none" stroke="#FFF8E1" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Megaphone (voice): horn pointing up-right, white on amber -->
  <g filter="url(#shadow)">
    <!-- horn -->
    <path d="M40 78 L52 72 L52 46 L40 40 Z" fill="#FFFFFF" stroke="#B87A00" stroke-width="2"/>
    <!-- bell -->
    <path d="M52 46 L88 32 L88 86 L52 72 Z" fill="#FFFFFF" stroke="#B87A00" stroke-width="2"/>
    <!-- handle -->
    <rect x="42" y="76" width="9" height="18" rx="3" fill="#FFFFFF" stroke="#B87A00" stroke-width="2"/>
  </g>

  <!-- Sound waves from the bell -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
    <path d="M96 44 a22 22 0 0 1 0 30" opacity="0.95"/>
    <path d="M106 36 a34 34 0 0 1 0 46" stroke-width="3.5" opacity="0.6"/>
  </g>

  <!-- Small accent dots -->
  <circle cx="34" cy="58" r="2.5" fill="#FFFFFF" opacity="0.9"/>
</svg>
