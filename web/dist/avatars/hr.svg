<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" stroke-linecap="round" stroke-linejoin="round">
  <title>HR / People — cartoon department head</title>
  <desc>Warm HR partner with a soft bob haircut, heart hair clip and a joyful closed-eye smile.</desc>
  <circle cx="120" cy="120" r="116" fill="#FFF0E2"/>
  <circle cx="120" cy="120" r="116" fill="none" stroke="#F97316" stroke-width="6"/>
  <!-- decor -->
  <path d="M196 54 c-4 -5 -11 -1 -9 5 c1 3 5 6 9 9 c4 -3 8 -6 9 -9 c2 -6 -5 -10 -9 -5 Z" fill="#FB923C" opacity="0.8"/>
  <circle cx="46" cy="64" r="4" fill="#F97316" opacity="0.7"/>
  <circle cx="194" cy="188" r="4" fill="#F97316" opacity="0.7"/>
  <!-- bob haircut behind head -->
  <path d="M52 152 C48 82 82 54 120 54 C158 54 192 82 188 152 L176 168 C184 128 178 100 156 88 C134 76 96 78 78 96 C64 110 60 134 64 168 Z" fill="#3B2F2F" stroke="#2E2A38" stroke-width="5"/>
  <!-- ears -->
  <ellipse cx="60" cy="140" rx="10" ry="14" fill="#B97E56" stroke="#2E2A38" stroke-width="4.5"/>
  <ellipse cx="180" cy="140" rx="10" ry="14" fill="#B97E56" stroke="#2E2A38" stroke-width="4.5"/>
  <!-- head -->
  <path d="M62 132 C62 96 86 74 120 74 C154 74 178 96 178 132 C178 168 154 192 120 192 C86 192 62 168 62 132 Z" fill="#B97E56" stroke="#2E2A38" stroke-width="5"/>
  <!-- bangs -->
  <path d="M70 114 C72 84 168 84 170 114 C158 100 150 112 138 101 C126 112 112 100 100 109 C90 100 80 106 70 114 Z" fill="#3B2F2F" stroke="#2E2A38" stroke-width="4.5"/>
  <!-- heart hair clip -->
  <g transform="translate(76,122) rotate(-12)">
    <path d="M0 3 C-7 -5 -17 1 0 14 C17 1 7 -5 0 3 Z" fill="#F43F5E" stroke="#2E2A38" stroke-width="3.5"/>
  </g>
  <!-- blush -->
  <ellipse cx="84" cy="152" rx="9" ry="5" fill="#E88B70" opacity="0.6"/>
  <ellipse cx="156" cy="152" rx="9" ry="5" fill="#E88B70" opacity="0.6"/>
  <!-- happy closed eyes -->
  <path d="M84 128 Q97 117 110 128" fill="none" stroke="#2E2A38" stroke-width="5"/>
  <path d="M130 128 Q143 117 156 128" fill="none" stroke="#2E2A38" stroke-width="5"/>
  <!-- soft brows -->
  <path d="M86 110 Q97 105 108 110" fill="none" stroke="#3B2F2F" stroke-width="4"/>
  <path d="M132 110 Q143 105 154 110" fill="none" stroke="#3B2F2F" stroke-width="4"/>
  <!-- nose -->
  <path d="M116 143 Q120 149 124 143" fill="none" stroke="#2E2A38" stroke-width="3.5"/>
  <!-- open smile with tongue -->
  <clipPath id="hr-mouth">
    <path d="M94 156 C102 182 138 182 146 156 C136 166 104 166 94 156 Z"/>
  </clipPath>
  <path d="M94 156 C102 182 138 182 146 156 C136 166 104 166 94 156 Z" fill="#6E2F2F" stroke="#2E2A38" stroke-width="4"/>
  <g clip-path="url(#hr-mouth)">
    <ellipse cx="120" cy="173" rx="12" ry="7" fill="#F58AA6"/>
  </g>
</svg>
