<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" stroke-linecap="round" stroke-linejoin="round">
  <title>IT Support — cartoon department head</title>
  <desc>Calm support specialist wearing a headset with a mic boom, spiky hair tuft on top.</desc>
  <circle cx="120" cy="120" r="116" fill="#E9EBFF"/>
  <circle cx="120" cy="120" r="116" fill="none" stroke="#6366F1" stroke-width="6"/>
  <!-- decor -->
  <path d="M46 56 h10 M51 51 v10" stroke="#6366F1" stroke-width="4" opacity="0.7"/>
  <circle cx="196" cy="62" r="4" fill="#6366F1" opacity="0.7"/>
  <circle cx="48" cy="188" r="4" fill="#6366F1" opacity="0.7"/>
  <!-- ears -->
  <ellipse cx="58" cy="142" rx="9" ry="13" fill="#FFE3CC" stroke="#2E2A38" stroke-width="4.5"/>
  <ellipse cx="182" cy="142" rx="9" ry="13" fill="#FFE3CC" stroke="#2E2A38" stroke-width="4.5"/>
  <!-- head -->
  <path d="M60 134 C60 98 84 76 120 76 C156 76 180 98 180 134 C180 170 156 194 120 194 C84 194 60 170 60 134 Z" fill="#FFE3CC" stroke="#2E2A38" stroke-width="5"/>
  <!-- spiky hair tuft -->
  <path d="M84 84 L92 62 L103 80 L116 58 L127 78 L141 60 L148 84 C132 74 100 74 84 84 Z" fill="#453C67" stroke="#2E2A38" stroke-width="4.5"/>
  <!-- headset band -->
  <path d="M62 118 C62 62 178 62 178 118" fill="none" stroke="#4338CA" stroke-width="9"/>
  <!-- earpads -->
  <rect x="48" y="120" width="21" height="36" rx="10" fill="#6366F1" stroke="#2E2A38" stroke-width="4.5"/>
  <rect x="171" y="120" width="21" height="36" rx="10" fill="#6366F1" stroke="#2E2A38" stroke-width="4.5"/>
  <circle cx="58" cy="130" r="3.5" fill="#A5B4FC"/>
  <!-- mic boom -->
  <path d="M56 152 C54 172 74 182 96 178" fill="none" stroke="#4338CA" stroke-width="5"/>
  <ellipse cx="100" cy="177" rx="8" ry="6" fill="#818CF8" stroke="#2E2A38" stroke-width="4"/>
  <!-- blush -->
  <ellipse cx="86" cy="156" rx="8" ry="4.5" fill="#F2A58C" opacity="0.5"/>
  <ellipse cx="158" cy="156" rx="8" ry="4.5" fill="#F2A58C" opacity="0.5"/>
  <!-- relaxed eyes -->
  <ellipse cx="97" cy="132" rx="12.5" ry="13.5" fill="#FFFFFF" stroke="#2E2A38" stroke-width="4"/>
  <ellipse cx="143" cy="132" rx="12.5" ry="13.5" fill="#FFFFFF" stroke="#2E2A38" stroke-width="4"/>
  <circle cx="97" cy="135" r="6" fill="#2E2A38"/>
  <circle cx="143" cy="135" r="6" fill="#2E2A38"/>
  <circle cx="94.5" cy="131.5" r="2.2" fill="#FFFFFF"/>
  <circle cx="140.5" cy="131.5" r="2.2" fill="#FFFFFF"/>
  <!-- chill brows -->
  <path d="M84 112 Q97 108 110 112" fill="none" stroke="#453C67" stroke-width="4.5"/>
  <path d="M130 112 Q143 108 156 112" fill="none" stroke="#453C67" stroke-width="4.5"/>
  <!-- nose -->
  <path d="M116 147 Q120 153 124 147" fill="none" stroke="#2E2A38" stroke-width="3.5"/>
  <!-- warm smile -->
  <clipPath id="it-mouth">
    <path d="M100 162 C108 178 132 178 140 162 C130 169 110 169 100 162 Z"/>
  </clipPath>
  <path d="M100 162 C108 178 132 178 140 162 C130 169 110 169 100 162 Z" fill="#6E2F2F" stroke="#2E2A38" stroke-width="4"/>
  <g clip-path="url(#it-mouth)">
    <rect x="104" y="161" width="32" height="8" rx="4" fill="#FFFFFF"/>
  </g>
</svg>
