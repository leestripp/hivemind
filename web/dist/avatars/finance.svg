<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" stroke-linecap="round" stroke-linejoin="round">
  <title>Finance — cartoon department head</title>
  <desc>Accountant with a green visor, round glasses and a tidy mustache, coins floating nearby.</desc>
  <circle cx="120" cy="120" r="116" fill="#E4F7EC"/>
  <circle cx="120" cy="120" r="116" fill="none" stroke="#10B981" stroke-width="6"/>
  <!-- floating coins -->
  <circle cx="44" cy="66" r="11" fill="#FCD34D" stroke="#B45309" stroke-width="3.5"/>
  <circle cx="44" cy="66" r="5" fill="none" stroke="#B45309" stroke-width="2.5"/>
  <circle cx="196" cy="56" r="8" fill="#FCD34D" stroke="#B45309" stroke-width="3"/>
  <circle cx="196" cy="56" r="3.5" fill="none" stroke="#B45309" stroke-width="2"/>
  <circle cx="198" cy="186" r="4" fill="#10B981" opacity="0.7"/>
  <!-- ears -->
  <ellipse cx="58" cy="140" rx="10" ry="14" fill="#F3C9A0" stroke="#2E2A38" stroke-width="4.5"/>
  <ellipse cx="182" cy="140" rx="10" ry="14" fill="#F3C9A0" stroke="#2E2A38" stroke-width="4.5"/>
  <!-- head -->
  <path d="M60 132 C60 96 84 74 120 74 C156 74 180 96 180 132 C180 168 156 192 120 192 C84 192 60 168 60 132 Z" fill="#F3C9A0" stroke="#2E2A38" stroke-width="5"/>
  <!-- balding side hair -->
  <path d="M61 140 C56 112 66 96 80 92 C73 106 71 124 71 142 Z" fill="#6B5B4F" stroke="#2E2A38" stroke-width="4"/>
  <path d="M179 140 C184 112 174 96 160 92 C167 106 169 124 169 142 Z" fill="#6B5B4F" stroke="#2E2A38" stroke-width="4"/>
  <!-- accountant visor -->
  <path d="M62 104 C62 82 178 82 178 104 L172 114 C150 102 90 102 68 114 Z" fill="#34D399" opacity="0.85" stroke="#047857" stroke-width="4"/>
  <!-- eyes -->
  <ellipse cx="97" cy="130" rx="12" ry="13" fill="#FFFFFF" stroke="#2E2A38" stroke-width="4"/>
  <ellipse cx="143" cy="130" rx="12" ry="13" fill="#FFFFFF" stroke="#2E2A38" stroke-width="4"/>
  <circle cx="97" cy="132" r="5.5" fill="#2E2A38"/>
  <circle cx="143" cy="132" r="5.5" fill="#2E2A38"/>
  <circle cx="95" cy="129" r="2" fill="#FFFFFF"/>
  <circle cx="141" cy="129" r="2" fill="#FFFFFF"/>
  <!-- round glasses -->
  <circle cx="97" cy="130" r="17" fill="#FFFFFF" opacity="0.25" stroke="#2E2A38" stroke-width="4"/>
  <circle cx="143" cy="130" r="17" fill="#FFFFFF" opacity="0.25" stroke="#2E2A38" stroke-width="4"/>
  <path d="M114 128 H126" stroke="#2E2A38" stroke-width="4"/>
  <path d="M80 126 L62 122 M160 126 L178 122" stroke="#2E2A38" stroke-width="4"/>
  <!-- grey brows -->
  <path d="M84 108 Q97 103 110 107" fill="none" stroke="#8A8378" stroke-width="4"/>
  <path d="M130 107 Q143 103 156 108" fill="none" stroke="#8A8378" stroke-width="4"/>
  <!-- nose -->
  <path d="M116 144 Q120 150 124 144" fill="none" stroke="#2E2A38" stroke-width="3.5"/>
  <!-- mustache -->
  <path d="M102 155 Q111 147 120 154 Q129 147 138 155 Q129 162 120 158 Q111 162 102 155 Z" fill="#6B5B4F" stroke="#2E2A38" stroke-width="3.5"/>
  <!-- content smile -->
  <path d="M108 168 Q120 176 132 168" fill="none" stroke="#2E2A38" stroke-width="4"/>
  <!-- blush -->
  <ellipse cx="80" cy="150" rx="8" ry="4.5" fill="#F2A58C" opacity="0.45"/>
  <ellipse cx="160" cy="150" rx="8" ry="4.5" fill="#F2A58C" opacity="0.45"/>
</svg>
