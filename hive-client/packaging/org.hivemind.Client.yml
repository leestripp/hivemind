# Flatpak manifest for the HiveMind GTK4 client.
# Build:  flatpak-builder --force-clean build-dir hive-client/packaging/org.hivemind.Client.yml
# Run:    flatpak-builder --run build-dir hive-client/packaging/org.hivemind.Client.yml hive-client
app-id: org.hivemind.Client
runtime: org.gnome.Platform
runtime-version: "48"
sdk: org.gnome.Sdk
command: hive-client
finish-args:
  - --share=network              # talks to hive-server over HTTP(S)
  - --socket=wayland
  - --socket=fallback-x11

modules:
  # ── gtkmm-4.0 stack (not in the GNOME runtime) ──────────────────────
  - name: mm-common
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.gnome.org/sources/mm-common/1.0/mm-common-1.0.6.tar.xz
        sha256: b55c46037dbcdabc5cee3b389ea11cc3910adb68ebe883e9477847aa660862e7

  - name: libsigcplusplus
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libsigc++/3.0/libsigc++-3.0.7.tar.xz
        sha256: bfbe91c0d094ea6bbc6cbd3909b7d98c6561eea8b6d9c0c25add906a6e83d733

  - name: glibmm
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.gnome.org/sources/glibmm/2.80/glibmm-2.80.1.tar.xz
        sha256: f1a0c0ec514e3774bf993396f17f72106b40912c7d7cc9d10da31ba15517e3f5

  - name: cairomm
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.gnome.org/sources/cairomm/1.15/cairomm-1.15.4.tar.xz
        sha256: 4cd9fd959538953dfa606aaa7a31381e3193eebf14d814d97ef928684ee9feb5

  - name: pangomm
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.gnome.org/sources/pangomm/2.52/pangomm-2.52.0.tar.xz
        sha256: 34a134126a6484ff12f774358c36ecc44d0e9df094e1b83796d9774bb7d24947

  - name: gtkmm
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gtkmm/4.16/gtkmm-4.16.0.tar.xz
        sha256: 3b23fd3abf8fb223b00e9983b6010af2db80e38c89ab6994b8b6230aa85d60f9

  - name: nlohmann-json
    buildsystem: cmake-ninja
    config-opts:
      - -DJSON_BuildTests=OFF
    sources:
      - type: git
        url: https://github.com/nlohmann/json.git
        tag: v3.11.3

  # ── OmniNet (pre-fetched; the superbuild uses it via
  #    FETCHCONTENT_SOURCE_DIR_OMNINET) ────────────────────────────────
  - name: omninet-src
    buildsystem: simple
    build-commands: []
    sources:
      - type: git
        url: https://gitlab.com/leestripp/omninet.git
        branch: main
        dest: omninet-src

  # ── the client ──────────────────────────────────────────────────────
  - name: hivemind
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DHIVEMIND_BUILD_SERVER=OFF
      - -DHIVEMIND_USE_DAEDALUS=OFF
      - -DBUILD_TESTING=OFF
      - -DFETCHCONTENT_SOURCE_DIR_OMNINET=/run/build/omninet-src
    build-commands: []
    post-install:
      - install -Dm755 build/hive-client/hive-client /app/bin/hive-client
      - install -Dm644 hive-client/packaging/org.hivemind.Client.desktop /app/share/applications/org.hivemind.Client.desktop
      - install -Dm644 hive-client/packaging/org.hivemind.Client.metainfo.xml /app/share/metainfo/org.hivemind.Client.metainfo.xml
      - install -Dm644 hive-client/data/icons/hive.svg /app/share/icons/hicolor/scalable/apps/org.hivemind.Client.svg
    sources:
      - type: dir
        path: ../..
