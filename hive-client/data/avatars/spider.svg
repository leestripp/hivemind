  <circle cx="109" cy="109" r="3" fill="#2E2A38"/>
  <circle cx="133" cy="109" r="3" fill="#2E2A38"/>
    <ellipse cx="90" cy="156" rx="8" ry="5" fill="#F2A58C" opacity="0.7"/>
