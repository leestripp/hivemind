<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" stroke-linecap="round" stroke-linejoin="round">
  <title>Design — cartoon department head</title>
  <desc>Playful designer in a purple beret, winking, with a pencil tucked behind the ear.</desc>
  <circle cx="120" cy="120" r="116" fill="#F6ECFF"/>
  <circle cx="120" cy="120" r="116" fill="none" stroke="#A855F7" stroke-width="6"/>
  <!-- decor -->
  <circle cx="196" cy="58" r="4" fill="#A855F7" opacity="0.7"/>
  <circle cx="44" cy="60" r="5" fill="none" stroke="#A855F7" stroke-width="3" opacity="0.7"/>
  <path d="M196 184 l4 8 4 -8 -4 -8 Z" fill="#A855F7" opacity="0.6"/>
  <!-- ears -->
  <ellipse cx="58" cy="140" rx="10" ry="14" fill="#E8B48C" stroke="#2E2A38" stroke-width="4.5"/>
  <ellipse cx="182" cy="140" rx="10" ry="14" fill="#E8B48C" stroke="#2E2A38" stroke-width="4.5"/>
  <!-- head -->
  <path d="M60 132 C60 96 84 74 120 74 C156 74 180 96 180 132 C180 168 156 192 120 192 C84 192 60 168 60 132 Z" fill="#E8B48C" stroke="#2E2A38" stroke-width="5"/>
  <!-- colorful strands under beret -->
  <path d="M150 96 C164 104 170 122 166 144 L155 139 C159 122 155 108 145 100 Z" fill="#2DD4BF" stroke="#2E2A38" stroke-width="4"/>
  <path d="M88 100 C77 108 73 124 78 140 L88 136 C84 121 87 108 95 102 Z" fill="#F472B6" stroke="#2E2A38" stroke-width="4"/>
  <!-- blush -->
  <ellipse cx="82" cy="152" rx="8" ry="4.5" fill="#EE9F80" opacity="0.5"/>
  <ellipse cx="158" cy="152" rx="8" ry="4.5" fill="#EE9F80" opacity="0.5"/>
  <!-- paint dot on cheek -->
  <circle cx="162" cy="144" r="2.6" fill="#F472B6"/>
  <!-- winking left eye -->
  <path d="M85 130 Q97 121 109 130" fill="none" stroke="#2E2A38" stroke-width="5"/>
  <!-- open right eye with lashes -->
  <ellipse cx="143" cy="128" rx="13" ry="15" fill="#FFFFFF" stroke="#2E2A38" stroke-width="4"/>
  <circle cx="143" cy="131" r="6.5" fill="#2E2A38"/>
  <circle cx="140.5" cy="127.5" r="2.2" fill="#FFFFFF"/>
  <path d="M153 113 l5 -4 M157 120 l6 -2 M149 109 l3 -6" stroke="#2E2A38" stroke-width="3"/>
  <!-- brows: right raised -->
  <path d="M86 108 Q97 104 108 108" fill="none" stroke="#6B4A2F" stroke-width="4.5"/>
  <path d="M130 104 Q143 96 156 102" fill="none" stroke="#6B4A2F" stroke-width="4.5"/>
  <!-- nose -->
  <path d="M116 143 Q120 149 124 143" fill="none" stroke="#2E2A38" stroke-width="3.5"/>
  <!-- playful smirk -->
  <path d="M100 160 Q124 174 144 158" fill="none" stroke="#2E2A38" stroke-width="4.5"/>
  <path d="M146 155 l4 -3" stroke="#2E2A38" stroke-width="3"/>
  <!-- beret -->
  <g transform="rotate(-6 120 88)">
    <path d="M64 98 C68 62 172 56 184 88 C188 101 176 108 158 105 C118 114 72 113 64 98 Z" fill="#A855F7" stroke="#2E2A38" stroke-width="5"/>
    <rect x="120" y="52" width="9" height="13" rx="4.5" fill="#7E22CE" stroke="#2E2A38" stroke-width="3.5"/>
  </g>
  <!-- pencil tucked behind ear -->
  <g transform="translate(193,116) rotate(28)">
    <rect x="-4.5" y="-30" width="9" height="7" rx="3" fill="#F472B6" stroke="#2E2A38" stroke-width="3"/>
    <rect x="-4.5" y="-24" width="9" height="4" fill="#94A3B8" stroke="#2E2A38" stroke-width="2.5"/>
    <rect x="-4.5" y="-20" width="9" height="30" fill="#FBBF24" stroke="#2E2A38" stroke-width="3.5"/>
    <path d="M-4.5 10 L0 22 L4.5 10 Z" fill="#F3D9B0" stroke="#2E2A38" stroke-width="3"/>
    <path d="M-1.8 17 L0 22 L1.8 17 Z" fill="#2E2A38"/>
  </g>
</svg>
