<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" stroke-linecap="round" stroke-linejoin="round">
  <title>Finance — cartoon department head (female)</title>
  <desc>Accountant with a top bun, green visor, round glasses and floating coins.</desc>
  <circle cx="120" cy="120" r="116" fill="#E4F7EC"/>
  <circle cx="120" cy="120" r="116" fill="none" stroke="#10B981" stroke-width="6"/>
  <!-- floating coins -->
  <circle cx="44" cy="66" r="11" fill="#FCD34D" stroke="#B45309" stroke-width="3.5"/>
  <circle cx="44" cy="66" r="5" fill="none" stroke="#B45309" stroke-width="2.5"/>
  <circle cx="196" cy="56" r="8" fill="#FCD34D" stroke="#B45309" stroke-width="3"/>
  <circle cx="196" cy="56" r="3.5" fill="none" stroke="#B45309" stroke-width="2"/>
  <circle cx="198" cy="186" r="4" fill="#10B981" opacity="0.7"/>
  <!-- ears -->
  <ellipse cx="58" cy="140" rx="10" ry="14" fill="#F6D3B3" stroke="#2E2A38" stroke-width="4.5"/>
  <ellipse cx="182" cy="140" rx="10" ry="14" fill="#F6D3B3" stroke="#2E2A38" stroke-width="4.5"/>
  <!-- stud earrings -->
  <circle cx="57" cy="157" r="3.8" fill="#FCD34D" stroke="#2E2A38" stroke-width="3"/>
  <circle cx="183" cy="157" r="3.8" fill="#FCD34D" stroke="#2E2A38" stroke-width="3"/>
  <!-- head -->
  <path d="M60 132 C60 96 84 74 120 74 C156 74 180 96 180 132 C180 168 156 192 120 192 C84 192 60 168 60 132 Z" fill="#F6D3B3" stroke="#2E2A38" stroke-width="5"/>
  <!-- hair pulled to a bun -->
  <path d="M62 112 C60 74 90 62 120 62 C150 62 180 74 178 114 L170 110 C170 88 146 76 120 78 C94 80 70 90 70 112 Z" fill="#4A3226" stroke="#2E2A38" stroke-width="5"/>
  <circle cx="120" cy="52" r="15" fill="#4A3226" stroke="#2E2A38" stroke-width="5"/>
  <path d="M112 50 Q120 44 128 50" fill="none" stroke="#2E2A38" stroke-width="3"/>
  <!-- accountant visor -->
  <path d="M62 104 C62 84 178 84 178 104 L172 114 C150 102 90 102 68 114 Z" fill="#34D399" opacity="0.85" stroke="#047857" stroke-width="4"/>
  <!-- eyes with lashes -->
  <ellipse cx="97" cy="130" rx="12" ry="13" fill="#FFFFFF" stroke="#2E2A38" stroke-width="4"/>
  <ellipse cx="143" cy="130" rx="12" ry="13" fill="#FFFFFF" stroke="#2E2A38" stroke-width="4"/>
  <circle cx="97" cy="132" r="5.5" fill="#2E2A38"/>
  <circle cx="143" cy="132" r="5.5" fill="#2E2A38"/>
  <circle cx="95" cy="129" r="2" fill="#FFFFFF"/>
  <circle cx="141" cy="129" r="2" fill="#FFFFFF"/>
  <path d="M86 121 l-5 -4 M90 117 l-3 -5" stroke="#2E2A38" stroke-width="3"/>
  <path d="M154 121 l5 -4 M150 117 l3 -5" stroke="#2E2A38" stroke-width="3"/>
  <!-- round glasses -->
  <circle cx="97" cy="130" r="17" fill="#FFFFFF" opacity="0.25" stroke="#2E2A38" stroke-width="4"/>
  <circle cx="143" cy="130" r="17" fill="#FFFFFF" opacity="0.25" stroke="#2E2A38" stroke-width="4"/>
  <path d="M114 128 H126" stroke="#2E2A38" stroke-width="4"/>
  <path d="M80 126 L62 122 M160 126 L178 122" stroke="#2E2A38" stroke-width="4"/>
  <!-- brows -->
  <path d="M86 109 Q97 104 108 108" fill="none" stroke="#4A3226" stroke-width="4"/>
  <path d="M132 108 Q143 104 154 109" fill="none" stroke="#4A3226" stroke-width="4"/>
  <!-- nose -->
  <path d="M116 144 Q120 150 124 144" fill="none" stroke="#2E2A38" stroke-width="3.5"/>
  <!-- content smile with lip tint -->
  <path d="M106 166 Q120 175 134 166" fill="none" stroke="#B34A50" stroke-width="4.5"/>
  <!-- blush -->
  <ellipse cx="80" cy="152" rx="8" ry="4.5" fill="#F2A58C" opacity="0.5"/>
  <ellipse cx="160" cy="152" rx="8" ry="4.5" fill="#F2A58C" opacity="0.5"/>
</svg>
