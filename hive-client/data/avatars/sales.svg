<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" stroke-linecap="round" stroke-linejoin="round">
  <title>Sales — cartoon department head</title>
  <desc>Confident salesperson with slick hair, dollar-sign eyes, a toothy grin and a blue tie.</desc>
  <circle cx="120" cy="120" r="116" fill="#E2F3FF"/>
  <circle cx="120" cy="120" r="116" fill="none" stroke="#0EA5E9" stroke-width="6"/>
  <!-- decor -->
  <path d="M46 52 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 Z" fill="#0EA5E9" opacity="0.65"/>
  <circle cx="194" cy="60" r="4" fill="#0EA5E9" opacity="0.7"/>
  <circle cx="46" cy="186" r="4" fill="#0EA5E9" opacity="0.7"/>
  <!-- ears -->
  <ellipse cx="58" cy="140" rx="10" ry="14" fill="#E9B98D" stroke="#2E2A38" stroke-width="4.5"/>
  <ellipse cx="182" cy="140" rx="10" ry="14" fill="#E9B98D" stroke="#2E2A38" stroke-width="4.5"/>
  <!-- head -->
  <path d="M60 132 C60 96 84 74 120 74 C156 74 180 96 180 132 C180 168 156 192 120 192 C84 192 60 168 60 132 Z" fill="#E9B98D" stroke="#2E2A38" stroke-width="5"/>
  <!-- blush -->
  <ellipse cx="82" cy="152" rx="8" ry="4.5" fill="#EE9F80" opacity="0.5"/>
  <ellipse cx="158" cy="152" rx="8" ry="4.5" fill="#EE9F80" opacity="0.5"/>
  <!-- eyes with dollar pupils -->
  <ellipse cx="97" cy="128" rx="12.5" ry="14" fill="#FFFFFF" stroke="#2E2A38" stroke-width="4"/>
  <ellipse cx="143" cy="128" rx="12.5" ry="14" fill="#FFFFFF" stroke="#2E2A38" stroke-width="4"/>
  <text x="97" y="135" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#15803D" text-anchor="middle">$</text>
  <text x="143" y="135" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#15803D" text-anchor="middle">$</text>
  <!-- raised brows -->
  <path d="M82 102 Q97 93 112 100" fill="none" stroke="#2F2A33" stroke-width="5"/>
  <path d="M128 98 Q143 89 158 96" fill="none" stroke="#2F2A33" stroke-width="5"/>
  <!-- nose -->
  <path d="M116 143 Q120 149 124 143" fill="none" stroke="#2E2A38" stroke-width="3.5"/>
  <!-- toothy grin -->
  <clipPath id="sales-mouth">
    <path d="M92 156 C100 182 140 182 148 156 C140 164 100 164 92 156 Z"/>
  </clipPath>
  <path d="M92 156 C100 182 140 182 148 156 C140 164 100 164 92 156 Z" fill="#6E2F2F" stroke="#2E2A38" stroke-width="4"/>
  <g clip-path="url(#sales-mouth)">
    <rect x="98" y="155" width="44" height="12" rx="5" fill="#FFFFFF"/>
    <path d="M113 155 V168 M127 155 V168" stroke="#D8D3C8" stroke-width="2"/>
    <ellipse cx="120" cy="176" rx="11" ry="6" fill="#F58AA6"/>
  </g>
  <!-- chin dimple -->
  <path d="M115 189 Q120 192 125 189" fill="none" stroke="#2E2A38" stroke-width="2.5"/>
  <!-- slick side-part hair -->
  <path d="M61 120 C57 72 92 58 120 58 C150 58 183 74 179 122 L170 117 C170 92 142 82 120 84 C96 86 72 96 70 117 Z" fill="#2F2A33" stroke="#2E2A38" stroke-width="5"/>
  <path d="M82 86 C102 74 140 72 158 88" fill="none" stroke="#55506B" stroke-width="3.5"/>
  <!-- collar and tie -->
  <path d="M104 194 L120 208 L136 194" fill="#FFFFFF" stroke="#2E2A38" stroke-width="4"/>
  <rect x="113" y="204" width="14" height="12" rx="4" fill="#0284C7" stroke="#2E2A38" stroke-width="3.5"/>
  <path d="M113 214 L120 234 L127 214 Z" fill="#0EA5E9" stroke="#2E2A38" stroke-width="3.5"/>
</svg>
