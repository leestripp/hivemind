<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" stroke-linecap="round" stroke-linejoin="round">
  <title>Engineering — cartoon department head (female)</title>
  <desc>Engineer with a yellow hard hat, goggles and a brown ponytail out the back.</desc>
  <circle cx="120" cy="120" r="116" fill="#FFEFD2"/>
  <circle cx="120" cy="120" r="116" fill="none" stroke="#F59E0B" stroke-width="6"/>
  <!-- decor -->
  <path d="M50 52 v12 M44 58 h12" stroke="#F59E0B" stroke-width="4" opacity="0.7"/>
  <circle cx="192" cy="62" r="4" fill="#F59E0B" opacity="0.7"/>
  <circle cx="50" cy="188" r="4" fill="#F59E0B" opacity="0.7"/>
  <!-- ears -->
  <ellipse cx="58" cy="140" rx="10" ry="14" fill="#F0C297" stroke="#2E2A38" stroke-width="4.5"/>
  <ellipse cx="182" cy="140" rx="10" ry="14" fill="#F0C297" stroke="#2E2A38" stroke-width="4.5"/>
  <!-- stud earrings -->
  <circle cx="57" cy="157" r="3.8" fill="#FCD34D" stroke="#2E2A38" stroke-width="3"/>
  <circle cx="183" cy="157" r="3.8" fill="#FCD34D" stroke="#2E2A38" stroke-width="3"/>
  <!-- head -->
  <path d="M60 132 C60 96 84 74 120 74 C156 74 180 96 180 132 C180 168 156 192 120 192 C84 192 60 168 60 132 Z" fill="#F0C297" stroke="#2E2A38" stroke-width="5"/>
  <!-- blush -->
  <ellipse cx="82" cy="152" rx="8" ry="4.5" fill="#F2A58C" opacity="0.55"/>
  <ellipse cx="158" cy="152" rx="8" ry="4.5" fill="#F2A58C" opacity="0.55"/>
  <!-- eyes with lashes -->
  <ellipse cx="97" cy="128" rx="12.5" ry="14" fill="#FFFFFF" stroke="#2E2A38" stroke-width="4"/>
  <ellipse cx="143" cy="128" rx="12.5" ry="14" fill="#FFFFFF" stroke="#2E2A38" stroke-width="4"/>
  <circle cx="98" cy="131" r="6" fill="#2E2A38"/>
  <circle cx="144" cy="131" r="6" fill="#2E2A38"/>
  <circle cx="95.5" cy="127.5" r="2.2" fill="#FFFFFF"/>
  <circle cx="141.5" cy="127.5" r="2.2" fill="#FFFFFF"/>
  <path d="M85 119 l-5 -4 M90 115 l-3 -5" stroke="#2E2A38" stroke-width="3"/>
  <path d="M155 119 l5 -4 M150 115 l3 -5" stroke="#2E2A38" stroke-width="3"/>
  <!-- brows -->
  <path d="M84 107 Q97 101 110 106" fill="none" stroke="#6B4226" stroke-width="4"/>
  <path d="M130 106 Q143 101 156 107" fill="none" stroke="#6B4226" stroke-width="4"/>
  <!-- nose -->
  <path d="M116 143 Q120 149 124 143" fill="none" stroke="#2E2A38" stroke-width="3.5"/>
  <!-- smile -->
  <path d="M94 158 C104 176 136 176 146 158 C136 167 104 167 94 158 Z" fill="#6E2F2F" stroke="#2E2A38" stroke-width="4"/>
  <!-- bangs under the hat -->
  <path d="M78 116 C86 104 98 108 106 112 C116 105 128 105 138 112 C148 106 158 108 162 116 L162 106 L78 106 Z" fill="#6B4226" stroke="#2E2A38" stroke-width="4"/>
  <!-- hard hat -->
  <path d="M64 108 C64 66 176 66 176 108 Z" fill="#FFC83D" stroke="#2E2A38" stroke-width="5"/>
  <rect x="110" y="60" width="20" height="20" rx="9" fill="#FFB020" stroke="#2E2A38" stroke-width="4"/>
  <rect x="50" y="104" width="140" height="15" rx="7.5" fill="#FFB020" stroke="#2E2A38" stroke-width="5"/>
  <!-- goggles on the hat -->
  <path d="M90 86 H66 M150 86 H174" fill="none" stroke="#2E2A38" stroke-width="4"/>
  <circle cx="100" cy="86" r="11" fill="#BEE3F8" stroke="#2E2A38" stroke-width="4"/>
  <circle cx="140" cy="86" r="11" fill="#BEE3F8" stroke="#2E2A38" stroke-width="4"/>
  <path d="M111 86 H129" stroke="#2E2A38" stroke-width="4"/>
  <path d="M95 82 l6 -3 M135 82 l6 -3" stroke="#FFFFFF" stroke-width="2.5"/>
  <!-- ponytail out the back -->
  <path d="M184 112 C204 118 210 142 200 162 C196 146 190 130 176 122 Z" fill="#6B4226" stroke="#2E2A38" stroke-width="4.5"/>
  <circle cx="188" cy="118" r="5" fill="#F59E0B" stroke="#2E2A38" stroke-width="3.5"/>
</svg>
