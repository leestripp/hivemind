<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" stroke-linecap="round" stroke-linejoin="round">
  <title>Operations — cartoon department head (female)</title>
  <desc>Ops lead with an orange bandana, side braid and a floating gear.</desc>
  <circle cx="120" cy="120" r="116" fill="#DBF6F0"/>
  <circle cx="120" cy="120" r="116" fill="none" stroke="#14B8A6" stroke-width="6"/>
  <!-- floating gear -->
  <g transform="translate(44,64)">
    <g fill="#0F766E">
      <rect x="-3.5" y="-24" width="7" height="9" rx="2.5"/>
      <rect x="-3.5" y="-24" width="7" height="9" rx="2.5" transform="rotate(45)"/>
      <rect x="-3.5" y="-24" width="7" height="9" rx="2.5" transform="rotate(90)"/>
      <rect x="-3.5" y="-24" width="7" height="9" rx="2.5" transform="rotate(135)"/>
      <rect x="-3.5" y="-24" width="7" height="9" rx="2.5" transform="rotate(180)"/>
      <rect x="-3.5" y="-24" width="7" height="9" rx="2.5" transform="rotate(225)"/>
      <rect x="-3.5" y="-24" width="7" height="9" rx="2.5" transform="rotate(270)"/>
      <rect x="-3.5" y="-24" width="7" height="9" rx="2.5" transform="rotate(315)"/>
    </g>
    <circle r="15" fill="#0F766E"/>
    <circle r="6" fill="#DBF6F0"/>
  </g>
  <!-- decor -->
  <circle cx="196" cy="58" r="4" fill="#14B8A6" opacity="0.7"/>
  <circle cx="50" cy="186" r="4" fill="#14B8A6" opacity="0.7"/>
  <!-- ears -->
  <ellipse cx="58" cy="140" rx="10" ry="14" fill="#C68E5E" stroke="#2E2A38" stroke-width="4.5"/>
  <ellipse cx="182" cy="140" rx="10" ry="14" fill="#C68E5E" stroke="#2E2A38" stroke-width="4.5"/>
  <!-- stud earring (visible ear) -->
  <circle cx="183" cy="157" r="3.8" fill="#FCD34D" stroke="#2E2A38" stroke-width="3"/>
  <!-- head -->
  <path d="M60 132 C60 96 84 74 120 74 C156 74 180 96 180 132 C180 168 156 192 120 192 C84 192 60 168 60 132 Z" fill="#C68E5E" stroke="#2E2A38" stroke-width="5"/>
  <!-- side braid hanging left -->
  <g fill="#241A12" stroke="#2E2A38" stroke-width="4">
    <ellipse cx="60" cy="152" rx="10" ry="9"/>
    <ellipse cx="56" cy="169" rx="9" ry="8"/>
    <ellipse cx="54" cy="185" rx="8" ry="7"/>
  </g>
  <circle cx="54" cy="196" r="4" fill="#14B8A6" stroke="#2E2A38" stroke-width="3"/>
  <!-- blush -->
  <ellipse cx="82" cy="152" rx="8" ry="4.5" fill="#D98E5F" opacity="0.55"/>
  <ellipse cx="158" cy="152" rx="8" ry="4.5" fill="#D98E5F" opacity="0.55"/>
  <!-- eyes with lashes -->
  <ellipse cx="97" cy="128" rx="12.5" ry="14" fill="#FFFFFF" stroke="#2E2A38" stroke-width="4"/>
  <ellipse cx="143" cy="128" rx="12.5" ry="14" fill="#FFFFFF" stroke="#2E2A38" stroke-width="4"/>
  <circle cx="98" cy="131" r="6" fill="#2E2A38"/>
  <circle cx="144" cy="131" r="6" fill="#2E2A38"/>
  <circle cx="95.5" cy="127.5" r="2.2" fill="#FFFFFF"/>
  <circle cx="141.5" cy="127.5" r="2.2" fill="#FFFFFF"/>
  <path d="M85 119 l-5 -4 M90 115 l-3 -5" stroke="#2E2A38" stroke-width="3"/>
  <path d="M155 119 l5 -4 M150 115 l3 -5" stroke="#2E2A38" stroke-width="3"/>
  <!-- focused brows -->
  <path d="M85 105 Q97 101 109 107" fill="none" stroke="#241A12" stroke-width="4.5"/>
  <path d="M131 107 Q143 101 155 105" fill="none" stroke="#241A12" stroke-width="4.5"/>
  <!-- nose -->
  <path d="M116 143 Q120 149 124 143" fill="none" stroke="#2E2A38" stroke-width="3.5"/>
  <!-- determined smile with lip tint -->
  <path d="M100 160 Q122 171 142 158" fill="none" stroke="#A8444A" stroke-width="4.5"/>
  <!-- bandana -->
  <path d="M61 106 C61 62 179 62 179 106 L171 113 C148 100 92 100 69 113 Z" fill="#F97316" stroke="#2E2A38" stroke-width="5"/>
  <path d="M86 80 q20 -9 44 -8 M96 94 q24 -7 48 -4" fill="none" stroke="#C2410C" stroke-width="3"/>
  <circle cx="180" cy="98" r="8" fill="#EA580C" stroke="#2E2A38" stroke-width="4"/>
  <path d="M184 92 L204 82 L199 102 Z" fill="#EA580C" stroke="#2E2A38" stroke-width="4"/>
  <path d="M186 104 L206 110 L190 116 Z" fill="#EA580C" stroke="#2E2A38" stroke-width="4"/>
</svg>
