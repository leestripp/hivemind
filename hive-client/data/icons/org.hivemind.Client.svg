<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="hiveGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7C14D"/>
      <stop offset="100%" stop-color="#D4930D"/>
    </linearGradient>
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C6BFF"/>
      <stop offset="100%" stop-color="#4E3ECF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Hexagon hive cell -->
  <polygon points="64,8 112,36 112,92 64,120 16,92 16,36"
           fill="url(#hiveGradient)" stroke="#B87A00" stroke-width="3"
           filter="url(#shadow)"/>

  <!-- Inner honeycomb grid lines -->
  <polygon points="64,22 100,43 100,85 64,106 28,85 28,43"
           fill="none" stroke="#FFF8E1" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Connection lines -->
  <line x1="64" y1="55" x2="48" y2="82" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="55" x2="80" y2="82" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="48" y1="82" x2="80" y2="82" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <!-- Nodes -->
  <circle cx="64" cy="55" r="10" fill="url(#nodeGradient)" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="48" cy="82" r="7" fill="url(#nodeGradient)" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="80" cy="82" r="7" fill="url(#nodeGradient)" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Small accent bees/dots -->
  <circle cx="64" cy="38" r="3" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="36" cy="62" r="2.5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="92" cy="62" r="2.5" fill="#FFFFFF" opacity="0.9"/>
</svg>
