global
    log /dev/log local0 info
    maxconn 2048
    user haproxy
    group haproxy
    stats socket /run/haproxy/admin.sock mode 600 level admin
    stats timeout 30s
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option redispatch
    retries 2
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout tunnel 86400s
    timeout http-request 10s
    timeout http-keep-alive 10s

userlist searxng_users
    user agent password <sha512-crypt-hash>

frontend leestrippai_http
    bind *:80

    acl host_leestrippai hdr(host) -i leestrippai.com
    http-request return status 404 content-type text/plain string "404 Not Found\n" if !host_leestrippai
    redirect scheme https code 301

frontend leestrippai_https
    bind *:443 ssl crt /etc/haproxy/certs/leestrippai.pem alpn http/1.1

    option forwardfor
    acl host_leestrippai hdr(host) -i leestrippai.com
    acl worker_channel path -i /api/workers/channel
    http-request set-header Host leestrippai.com
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port 443
    use_backend hivemind_workers if worker_channel
    default_backend hivemind_web

frontend searxng_https
    bind *:8443 ssl crt /etc/haproxy/certs/leestrippai.pem alpn http/1.1

    option forwardfor
    acl searxng_auth http_auth(searxng_users)
    http-request set-header Host leestrippai.com
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port 8443
    http-request auth realm searxng if !searxng_auth
    default_backend searxng

backend hivemind_web
    stick-table type ip size 10m expire 60s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }
    server hivemind_web 127.0.0.1:8421 check inter 5s fall 3 rise 2

backend hivemind_workers
    server hivemind_workers 127.0.0.1:8423 check inter 5s fall 3 rise 2

backend searxng
    server searxng 127.0.0.1:8888 check inter 5s fall 3 rise 2
