# renew_before_expiry = 30 days
version = 4.0.0
archive_dir = /etc/letsencrypt/archive/leestrippai.com
cert = /etc/letsencrypt/live/leestrippai.com/cert.pem
privkey = /etc/letsencrypt/live/leestrippai.com/privkey.pem
chain = /etc/letsencrypt/live/leestrippai.com/chain.pem
fullchain = /etc/letsencrypt/live/leestrippai.com/fullchain.pem

# Options used in the renewal process
[renewalparams]
pre_hook = systemctl stop haproxy
post_hook = systemctl start haproxy
account = <letsencrypt-account-id>

authenticator = standalone
server = https://acme-v02.api.letsencrypt.org/directory
key_type = ecdsa
